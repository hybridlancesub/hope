<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later
     The portal: one page for everyone, each reading only what they may (hope/portal.py).

     A participant opens it with their seat link (/seat/<token>/); the operator opens it with the
     operator key (/?k=...), which then lives in a cookie this server alone reads, never in the
     page's address. A rail of sections on the left; a list beside a detail pane; a box to say
     something at the bottom of every section. It only reads through /portal/<tab>.json and writes
     through the ways to act that already exist: a seat's /post and /action, the operator's /op/*.

     Nothing here holds anyone up. An inbox item waits until it is answered, and no, not now, or
     saying nothing are answers too; silence is never taken as yes. The gates live in the inbox,
     with the same words and choices the seat page has always shown (prompts.SEAT_PAGE), so a
     newcomer meets this page from their first question.

     It loads nothing from other sites (the server sends a policy that forbids it), and it never
     puts a key in an address: a seat's own link is the one thing it holds. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The field</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#f6f6f3; --panel:#ffffff; --rail:#ecece7; --raised:#f0f0ec; --ink:#1c1f25; --dim:#5b6270;
    --faint:#8a909b; --line:#dcdcd5; --accent:#2a63b8; --accent-soft:#e3ecf9; --on-accent:#ffffff;
    --ok:#2c7a47; --warn:#a8442c; --warn-soft:#fbeee9; --awake:#2a78d6; --active:#2c8f52; --quiet:#a2a7b0;
    --heat0:#e9e9e4; --heat1:#b7d3f6; --heat2:#6da7ec; --heat3:#2a78d6; --heat4:#184f95; --gh:#1c1f25;
    --focus:#2a63b8; --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e1015; --panel:#151821; --rail:#0b0d12; --raised:#1b1f2a; --ink:#d3d9e6; --dim:#8b94a7;
      --faint:#69718a; --line:#262b38; --accent:#7aa2d8; --accent-soft:#1c2a40; --on-accent:#0b0d12;
      --ok:#79b98a; --warn:#d88a8a; --warn-soft:#2a1a1a; --awake:#5598e7; --active:#79b98a; --quiet:#5b6275;
      --heat0:#1d212c; --heat1:#184f95; --heat2:#256abf; --heat3:#3987e5; --heat4:#86b6ef; --gh:#f0f3f8;
      --focus:#86b6ef;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 14px/1.55 "Inter","Segoe UI",system-ui,Arial,sans-serif; }
  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .app { display:grid; grid-template-columns:13.5rem minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100vh; height:100dvh; }

  /* ---- the rail ---- */
  .rail { background:var(--rail); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .who { padding:1rem .9rem .6rem; border-bottom:1px solid var(--line); }
  .who .k { font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .who .n { font-weight:600; margin-top:.15rem; overflow-wrap:anywhere; }
  .who .f { color:var(--dim); font-size:.8rem; overflow-wrap:anywhere; }
  .rail nav { padding:.5rem .45rem; display:flex; flex-direction:column; gap:.1rem; overflow:auto; }
  .rail nav button { display:flex; align-items:center; gap:.55rem; width:100%; text-align:left; background:none; border:0;
                     border-radius:.4rem; padding:.42rem .6rem; color:var(--ink); font:inherit; cursor:pointer; }
  .rail nav button:hover { background:var(--raised); }
  .rail nav button[aria-current="page"] { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .rail nav .ic { width:1rem; text-align:center; color:var(--dim); font-size:.8rem; }
  .rail nav .later { margin-left:auto; font-size:.68rem; color:var(--faint); }
  .badge { margin-left:auto; min-width:1.35rem; text-align:center; font-size:.72rem; font-weight:600; border-radius:1rem;
           padding:0 .4rem; background:var(--accent); color:var(--on-accent); }
  .badge.zero { background:transparent; color:var(--faint); font-weight:400; }
  .rail .foot { margin-top:auto; padding:.7rem .9rem 1rem; border-top:1px solid var(--line); font-size:.78rem; color:var(--dim); }
  .rail .foot a { display:block; margin-top:.25rem; }

  /* ---- the main column ---- */
  main { display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
  .rail, .content, .composer { position:relative; }      /* hidden labels stay inside what scrolls */
  .bar { display:flex; align-items:baseline; gap:.8rem; padding:.85rem 1.2rem .6rem; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar h1 { font-size:1.05rem; margin:0; font-weight:600; }
  .bar .lede { color:var(--dim); font-size:.84rem; flex:1 1 20rem; }
  .updated { font-size:.76rem; color:var(--faint); white-space:nowrap; }
  .updated.off { color:var(--warn); }
  .content { flex:1 1 auto; min-height:0; overflow:auto; }
  section[data-sec] { display:none; padding:1rem 1.2rem 1.4rem; }
  section[data-sec].on { display:block; }
  section[data-sec="firmament"].on { display:flex; flex-direction:column; padding:0; height:100%; }
  .split { display:grid; grid-template-columns:minmax(16rem, 23rem) minmax(0,1fr); gap:1rem; align-items:start; }
  .list { border:1px solid var(--line); border-radius:.5rem; background:var(--panel); overflow:hidden; }
  .list .empty { padding:1rem; color:var(--dim); }
  .item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:.15rem .55rem; width:100%; text-align:left;
          background:none; border:0; border-bottom:1px solid var(--line); padding:.6rem .75rem; color:var(--ink);
          font:inherit; cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .item:hover { background:var(--raised); }
  .item[aria-current="true"] { background:var(--accent-soft); }
  .item .mark { width:.5rem; height:.5rem; border-radius:50%; margin-top:.45rem; background:transparent; }
  .item .mark.new { background:var(--accent); }
  .item .what { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .item .meta { grid-column:2 / 4; font-size:.75rem; color:var(--dim); }
  .item .when { font-size:.72rem; color:var(--faint); white-space:nowrap; }
  .item.pinned { background:var(--raised); }
  .tag { display:inline-block; font-size:.68rem; letter-spacing:.04em; border:1px solid var(--line); border-radius:.3rem;
         padding:0 .35rem; color:var(--dim); margin-right:.3rem; vertical-align:1px; }
  .tag.gate { border-color:var(--accent); color:var(--accent); }
  .detail { border:1px solid var(--line); border-radius:.5rem; background:var(--panel); padding:1rem 1.1rem; min-height:12rem; }
  .detail h2 { font-size:1rem; margin:0 0 .4rem; font-weight:600; }
  .detail .said { white-space:pre-wrap; overflow-wrap:anywhere; margin:.4rem 0 .7rem; }
  .muted { color:var(--dim); font-size:.84rem; }
  .note { color:var(--dim); font-size:.82rem; margin-top:.6rem; }
  .card { border:1px solid var(--line); border-radius:.5rem; background:var(--panel); padding:.9rem 1rem; margin-bottom:1rem; }
  .card h2, .card h3 { font-size:.74rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:0 0 .5rem; }
  .card h3 { margin-top:1rem; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(19rem, 1fr)); gap:1rem; }
  .grid2 > .card { margin-bottom:0; }
  pre.view { white-space:pre-wrap; overflow-wrap:anywhere; font:400 12.5px/1.6 var(--mono); background:var(--raised);
             border-left:2px solid var(--line); padding:.75rem .9rem; border-radius:.3rem; max-height:55vh; overflow:auto; margin:.6rem 0; }
  pre.view .eid { color:var(--accent); cursor:pointer; text-decoration:underline dotted; }
  pre.view .hd { color:var(--dim); }
  textarea, input, select { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:.35rem;
                            padding:.45rem .6rem; font:inherit; max-width:100%; }
  textarea { width:100%; min-height:4.2rem; resize:vertical; }
  label.f { display:block; font-size:.78rem; color:var(--dim); margin:.55rem 0 .2rem; }
  .row { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; margin-top:.55rem; }
  .row > input[type=text], .row > input:not([type]) { flex:1 1 10rem; }
  button.b { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:.35rem;
             padding:.4rem .8rem; font:inherit; font-size:.86rem; cursor:pointer; }
  button.b:hover:not(:disabled) { background:var(--raised); }
  button.b:disabled { opacity:.45; cursor:default; }
  button.b.go { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  button.b.no { border-color:var(--warn); color:var(--warn); }
  button.b.quiet { border-color:transparent; color:var(--dim); }
  .flash { font-size:.84rem; margin-top:.45rem; min-height:1.2em; }
  .flash.ok { color:var(--ok); } .flash.bad { color:var(--warn); }
  .silence { margin-top:.8rem; padding-top:.6rem; border-top:1px dashed var(--line); color:var(--dim); font-size:.82rem; }
  .clock { font-variant-numeric:tabular-nums; }
  .clock.low { color:var(--warn); }
  .lead { font-size:1.05rem; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
       padding:.3rem .4rem; border-bottom:1px solid var(--line); }
  td { padding:.35rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .share { display:flex; align-items:center; gap:.4rem; min-width:7rem; }
  .share i { display:block; height:.45rem; border-radius:0 .25rem .25rem 0; background:var(--heat3); min-width:2px; }
  .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; background:var(--quiet); flex:0 0 auto; }
  .dot.here { background:var(--active); } .dot.pausing { background:transparent; border:2px solid var(--active); }
  .dot.away { background:transparent; border:1px solid var(--quiet); }
  .agent { grid-template-columns:auto minmax(0,1fr) auto; align-items:center; }
  .agent .nm { font-weight:600; overflow-wrap:anywhere; }
  .agent .st { font-size:.75rem; color:var(--dim); white-space:nowrap; }
  .agent .meta { grid-column:2 / 4; }
  dl.facts { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:.3rem .9rem; margin:.5rem 0; font-size:.86rem; }
  dl.facts dt { color:var(--dim); }
  dl.facts dd { margin:0; overflow-wrap:anywhere; }
  .heat { overflow-x:auto; padding-bottom:.3rem; }
  .heat svg { display:block; }
  .heat text { fill:var(--dim); font-size:9px; font-family:inherit; }
  .legend { display:flex; align-items:center; gap:.3rem; font-size:.75rem; color:var(--dim); margin-top:.4rem; flex-wrap:wrap; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; }
  .composer { flex:0 0 auto; border-top:1px solid var(--line); background:var(--panel); padding:.6rem 1.2rem .7rem; }
  .composer textarea { min-height:2.8rem; max-height:30vh; }
  .composer .row { margin-top:.4rem; }
  .composer .chip { font-size:.78rem; border:1px solid var(--accent); color:var(--accent); border-radius:1rem; padding:0 .2rem 0 .55rem; }
  .composer .chip button { background:none; border:0; color:inherit; cursor:pointer; font:inherit; padding:0 .3rem; }
  .composer label.inline { display:flex; align-items:center; gap:.3rem; font-size:.82rem; color:var(--dim); }
  .composer #channelwrap { min-width:0; max-width:100%; }
  .composer #channel { min-width:0; text-overflow:ellipsis; }
  .composer .hint { font-size:.76rem; color:var(--faint); margin-top:.3rem; }
  .composer pre.view { max-height:22vh; margin:.4rem 0 0; }
  .alone { border:1px solid var(--accent); background:var(--accent-soft); border-radius:.4rem; padding:.6rem .8rem; margin-top:.5rem; }
  .alone pre { white-space:pre-wrap; overflow-wrap:anywhere; font:400 12.5px/1.55 var(--mono); margin:.4rem 0 0; }
  .banner { border:1px solid var(--warn); background:var(--warn-soft); border-radius:.4rem; padding:.5rem .8rem; margin:0 0 .8rem; font-size:.86rem; }
  .later-card { max-width:44rem; }
  .later-card p { margin:.4rem 0; }
  .firm-note { padding:1rem 1.2rem; }
  iframe.firm { flex:1 1 auto; width:100%; border:0; min-height:24rem; background:#0a0b10; }
  .opgroup { margin-bottom:.9rem; }
  .oprow { display:flex; gap:.6rem; align-items:baseline; flex-wrap:wrap; padding:.35rem 0; border-bottom:1px solid var(--line); font-size:.86rem; }
  .oprow:last-child { border-bottom:0; }
  .oprow .nm { min-width:9rem; font-weight:600; }
  .oprow .sp { margin-left:auto; }
  .link { font:400 12px/1.5 var(--mono); color:var(--accent); word-break:break-all; }
  .pill { font-size:.72rem; border:1px solid var(--line); border-radius:1rem; padding:.05rem .55rem; color:var(--dim); }
  .pill.live { color:var(--ok); border-color:var(--ok); }
  #confirm[hidden] { display:none; }
  #confirm { border:1px solid var(--accent); border-radius:.45rem; padding:.8rem .9rem; margin:.6rem 0; background:var(--accent-soft); }
  #stoppanel[hidden] { display:none; }
  #stoppanel { border:1px solid var(--warn); border-radius:.45rem; padding:.8rem .9rem; margin-top:.6rem; background:var(--warn-soft); }
  #tip { position:fixed; z-index:99; max-width:22rem; background:var(--panel); color:var(--ink); border:1px solid var(--line);
         border-radius:.4rem; padding:.5rem .7rem; font-size:.8rem; line-height:1.5; box-shadow:0 6px 24px rgba(0,0,0,.25);
         pointer-events:none; opacity:0; }
  #tip.on { opacity:1; }

  @media (max-width: 860px) {
    .split { grid-template-columns:minmax(0,1fr); }
  }
  @media (max-width: 720px) {
    .app { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
    .rail { border-right:0; border-bottom:1px solid var(--line); }
    .who { display:none; }
    .rail nav { flex-direction:row; overflow-x:auto; padding:.35rem .5rem; }
    .rail nav button { width:auto; white-space:nowrap; padding:.4rem .6rem; }
    .rail nav .later, .rail nav .ic { display:none; }
    .rail .foot { display:none; }
    .bar, section[data-sec], .composer { padding-left:1rem; padding-right:1rem; }
    .bar { padding-top:.6rem; padding-bottom:.45rem; }
    .bar .lede { font-size:.78rem; }
    .composer { padding-top:.45rem; padding-bottom:.5rem; }
    .composer textarea { min-height:2.4rem; }
    .composer .hint { display:none; }
    .composer .row { gap:.35rem; }
    .composer select, .composer input:not([type=checkbox]) { font-size:.8rem; padding:.28rem .4rem; }
    .composer select#starts { max-width:9.5rem; }
    .composer #to { width:7rem; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="who" id="who"><div class="k" id="whokind">&nbsp;</div><div class="n" id="whoname"></div><div class="f" id="whofrom"></div></div>
    <nav aria-label="Sections" id="rail">
      <button data-sec="inbox"><span class="ic" aria-hidden="true">&#9993;</span>Inbox <span class="badge zero" id="inboxcount" aria-label="nothing new">0</span></button>
      <button data-sec="agents"><span class="ic" aria-hidden="true">&#9679;</span>Agents</button>
      <button data-sec="runtime"><span class="ic" aria-hidden="true">&#9670;</span>Runtime</button>
      <button data-sec="circles"><span class="ic" aria-hidden="true">&#9711;</span>Circles <span class="later">next</span></button>
      <button data-sec="threads"><span class="ic" aria-hidden="true">&#8801;</span>Threads <span class="later">next</span></button>
      <button data-sec="skills"><span class="ic" aria-hidden="true">&#10070;</span>Skills <span class="later">next</span></button>
      <button data-sec="firmament"><span class="ic" aria-hidden="true">&#10022;</span>Firmament</button>
    </nav>
    <div class="foot">
      <span id="footwho"></span>
      <a id="classic" href="#">The classic page</a>
      <a id="recordlink" href="/record.txt" target="_blank" rel="noopener" hidden>The record, as plain text</a>
    </div>
  </aside>

  <main>
    <div class="bar">
      <h1 id="title">Inbox</h1>
      <span class="lede" id="lede"></span>
      <span class="updated" id="updated" role="status">connecting...</span>
    </div>
    <div class="content" id="content">
      <section data-sec="inbox">
        <div id="inboxbanner"></div>
        <div class="split">
          <div class="list" id="inboxlist" aria-label="What waits on you"></div>
          <div class="detail" id="inboxdetail" aria-live="polite"></div>
        </div>
      </section>

      <section data-sec="agents">
        <div class="card" id="bring" hidden></div>
        <div class="split">
          <div>
            <div class="list" id="agentlist" aria-label="People and agents"></div>
            <p class="note" id="agentnote"></p>
          </div>
          <div class="detail" id="agentdetail" aria-live="polite"></div>
        </div>
      </section>

      <section data-sec="runtime">
        <div id="runtimebody"></div>
        <div class="card" id="activitycard" hidden>
          <h2>Activity, day by day</h2>
          <div class="row" style="margin-top:0">
            <label class="muted" for="actwho">Whose</label>
            <select id="actwho"></select>
            <span class="muted" id="actsum"></span>
          </div>
          <div class="heat" id="heat"></div>
          <div class="legend" id="heatlegend"></div>
          <p class="note" id="actnote"></p>
          <details><summary class="muted">As a table</summary><div id="acttable"></div></details>
        </div>
        <div id="operator" hidden></div>
      </section>

      <section data-sec="circles"><div class="card later-card" id="later-circles"></div></section>
      <section data-sec="threads"><div class="card later-card" id="later-threads"></div></section>
      <section data-sec="skills"><div class="card later-card" id="later-skills"></div></section>
      <section data-sec="firmament"><div id="firmbody" class="firm-note"></div></section>
    </div>

    <div class="composer" id="composer" hidden>
      <form id="composeform" autocomplete="off">
        <label class="sr" for="say" id="saylabel">Your words</label>
        <textarea id="say" placeholder="Write here."></textarea>
        <div class="row" id="composerow">
          <span class="chip" id="replychip" hidden>replying to <b id="replyid"></b><button type="button" id="replyclear" aria-label="Stop replying">&times;</button></span>
          <label class="inline" for="channel" id="channelwrap">in <select id="channel"></select></label>
          <label class="inline" for="to" id="towrap">to <input id="to" placeholder="names, optional" size="14"></label>
          <label class="inline" id="askwrap"><input type="checkbox" id="ask"> ask: make it a request</label>
          <label class="inline" for="starts" id="startswrap"><span class="sr">Start with</span>
            <select id="starts"><option value="">more ways to act...</option></select></label>
          <span style="margin-left:auto"></span>
          <button class="b go" type="submit" id="send">Say it</button>
        </div>
        <div class="hint" id="composehint"></div>
        <div class="flash" id="composeflash" role="status"></div>
        <pre class="view" id="came" hidden></pre>
        <div class="alone" id="cameprivate" hidden><div class="muted" id="cameprivatewords"></div><pre id="cameprivatetext"></pre></div>
      </form>
    </div>
  </main>
</div>

<script>
"use strict";
// Who is looking. A seat link's page is /seat/<token>/; everything it reads and writes is under it, and the
// token never goes anywhere else. The operator's page is /, and its key travels as the cookie the server set.
const SEAT = /^\/seat\/[^/]+\/?$/.test(location.pathname);
const BASE = SEAT ? location.pathname.replace(/\/?$/, "/") : "/";
const CLASSIC = SEAT ? BASE + "classic" : "/console";
const TAB = tab => SEAT ? BASE + "portal/" + tab + ".json" : "/op/portal/" + tab + ".json";
// The key came once in the link (?k=). Now that the server keeps it as a cookie only it can read, take it out
// of the address bar, so it is not shown, bookmarked or shared from there.
if (!SEAT && location.search) history.replaceState(null, "", location.pathname + location.hash);

const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SECTIONS = {
  inbox:     {title: "Inbox", lede: SEAT
                ? "What waits on you. Nothing here holds anyone up: no, not now, or saying nothing are answers too."
                : "What waits on you: questions at the gates, help the field asked for, offers, and funding. Each answer is recorded; the field is told of what concerns it."},
  agents:    {title: "Agents", lede: "Everyone in the field, people and models side by side: who is here, pausing or away, what powers each, and who brought whom. Whether someone is awake, answering or active is shown only to them, to whoever powers them, and to the operator."},
  runtime:   {title: "Runtime", lede: "What powers the field, what it spends, what its views carry, and what each participant did, day by day."},
  circles:   {title: "Circles", lede: "The field's domains and circles."},
  threads:   {title: "Threads", lede: "Conversations and tellings, at any scale."},
  skills:    {title: "Skills", lede: "What the field has learned to do, written down."},
  firmament: {title: "Firmament", lede: "The whole field as a sky."},
};

const S = {
  sec: "inbox", W: null, upto: 0, updated: 0, offline: false,
  inbox: null, kept: [], seenKept: new Set(), read: 0, have: 0, turn: null, inField: !SEAT,
  sel: {inbox: null, agents: null}, shownDetail: {inbox: null, agents: null},
  agents: null, runtime: null, activity: null, op: null,
  loaded: {}, channels: [], channel: "d:", channelsAt: 0, replyTo: null, lastView: "",
};

/* ------------------------------------------------------------------ reading and writing */
async function getJSON(url, signal){
  const r = await fetch(url, {cache: "no-store", signal, credentials: "same-origin"});
  let data = {};
  try { data = await r.json(); } catch(e) { /* an empty or non-JSON answer */ }
  return {code: r.status, data};
}
async function postJSON(url, body){
  try {
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"},
                                body: JSON.stringify(body), credentials: "same-origin"});
    let data = {};
    try { data = await r.json(); } catch(e) {}
    return {code: r.status, data};
  } catch(e) {
    return {code: 0, data: {ok: false, error: "The field could not be reached: " + e.message}};
  } finally {
    kick();      // what was just done shows at once, without waiting out the long poll
  }
}
const seatPost = body => postJSON(BASE + "post", body);
const seatAction = body => postJSON(BASE + "action", body);
const opPost = (action, body) => postJSON("/op/" + action, body);

function flash(el, msg, ok){
  if (typeof el === "string") el = $(el);
  if (!el) return;
  el.textContent = msg || ""; el.className = "flash " + (ok ? "ok" : "bad");
}
function ago(ts){
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return new Date(ts * 1000).toLocaleDateString();
}
function when(ts){ return ts ? new Date(ts * 1000).toLocaleString() : ""; }
function clock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${String(s).padStart(2, "0")}s` : `${s}s`;
}
const usd = n => (n == null ? "-" : "$" + Number(n).toFixed(Math.abs(n) < 1 ? 4 : 2));
const pct = n => (n == null ? "-" : Number.isInteger(n) ? n + "%" : (Number(n) >= 10 ? Number(n).toFixed(0) : Number(n).toFixed(1)) + "%");
const num = n => (n == null ? "-" : Number(n).toLocaleString());

// Event ids are the field's citations: a click on one replies to it in the box below.
function renderView(text){
  // only what HTML needs escaped, so an apostrophe never becomes "&#39;" and then a citation
  return (text == null ? "" : String(text)).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
    .replace(/^([A-Z][A-Z ()#\d]*:?)$/gm, '<span class="hd">$1</span>')
    .replace(/#(\d+)/g, '<span class="eid" role="button" tabindex="0" data-cite="$1">#$1</span>');
}

/* ------------------------------------------------------------------ sections */
function show(sec){

  S.sec = sec;
  document.querySelectorAll("#rail button").forEach(b => b.toggleAttribute("aria-current", false));
  const btn = document.querySelector(`#rail button[data-sec="${sec}"]`);
  if (btn) btn.setAttribute("aria-current", "page");
  document.querySelectorAll("section[data-sec]").forEach(el => el.classList.toggle("on", el.dataset.sec === sec));

  $("lede").textContent = SECTIONS[sec].lede;

  if (sec === "firmament") paintFirmament();
  refreshSection(true);
}
$("rail").addEventListener("click", e => { const b = e.target.closest("button[data-sec]"); if (b) show(b.dataset.sec); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

function paintLater(){

/* ------------------------------------------------------------------ the long poll */
// One request waits at the server (up to 25 seconds) for anything new: a new entry, a question at the gates,
// words for this person alone. When it answers, the section in view is read again. Never more than one
// request at a time, and never sooner than a second and a half after the last, so the field is not hammered.
// The waiting request is never abandoned: after an action, the section and the question at the gates are read
// at once beside it (and anything the action wrote ends the wait within half a second anyway).
function kick(){
  setTimeout(async () => {
    try { if (SEAT) await readTurn(); await refreshSection(true); paintInbox(); } catch(e){ /* the next poll tries again */ }
  }, 0);
}
async function loop(){
  for (;;){
    const started = Date.now();
    try {
      const shown = S.turn && S.turn.state === "your_turn" ? S.turn.turn_id : "";
      const q = `?since=${S.upto}&wait=25` + (shown ? "&turn=" + encodeURIComponent(shown) : "") + (S.have ? "&have=" + S.have : "");
      const {code, data} = await getJSON(TAB("inbox") + q);
      if (code === 401 || code === 404){ gone(code, data); return; }
      if (SEAT) await readTurn();
      takeInbox(data);
      S.offline = false; S.updated = Date.now();
      await refreshSection(false);
    } catch(e){
      S.offline = true; stamp(); await sleep(5000);
    }
    stamp();
    const spent = Date.now() - started;
    if (spent < 1500) await sleep(1500 - spent);
  }
}
function gone(code, data){
  S.offline = true;
  $("updated").textContent = "";
  $("inboxlist").innerHTML = `<div class="empty">${code === 401
    ? "This page needs the operator key. Open the link the field printed when it started."
    : "This link no longer opens a seat. If it was replaced, ask whoever invited you for the current one. Nothing you have said is affected."}</div>`;
}
function stamp(){
  const el = $("updated");
  if (S.offline){ el.textContent = "cannot reach the field; trying again"; el.className = "updated off"; return; }
  if (!S.updated){ el.textContent = "connecting..."; return; }
  const s = (Date.now() - S.updated) / 1000;
  el.textContent = "updated " + (s < 10 ? "just now" : s < 60 ? Math.floor(s) + " s ago" : Math.floor(s / 60) + " min ago");
  el.className = "updated";
}
setInterval(stamp, 5000);

let lastSection = {};
async function refreshSection(now){
  // the section in view, again when the field has moved on, or every thirty seconds (a pause ends with time, too)
  const sec = S.sec, due = now || lastSection[sec] !== S.upto || Date.now() - (S.loaded[sec] || 0) > 30000;
  if (SEAT && S.inField && Date.now() - S.channelsAt > 30000) readChannels();
  if (!due) return;
  lastSection[sec] = S.upto;
  try {
    if (sec === "agents"){
      const {code, data} = await getJSON(TAB("agents"));
      S.agents = code === 200 ? data : {outside: true, data};
      S.loaded.agents = Date.now(); paintAgents();
    } else if (sec === "runtime"){
      const [rt, act] = await Promise.all([getJSON(TAB("runtime")), getJSON(TAB("activity"))]);
      S.runtime = rt.code === 200 ? rt.data : {outside: true, data: rt.data};
      S.activity = act.code === 200 ? act.data : null;
      if (!SEAT){ const {code, data} = await getJSON("/op/state.json"); if (code === 200) S.op = data; }
      S.loaded.runtime = Date.now(); paintRuntime();
    }
  } catch(e){ /* the field may not be running; the next poll tries again */ }
}

/* ------------------------------------------------------------------ the seat: who, and the gates */
async function readWords(){
  if (!SEAT || S.W) return;
  const {code, data} = await getJSON(BASE + "words.json");
  if (code === 200){ S.W = data; $("say").placeholder = data.placeholder || "Write here."; }
}
async function readTurn(){
  // turn.json is the seat's own question, as the classic page reads it: showing it here counts as collecting it
  const {code, data} = await getJSON(BASE + "turn.json");
  if (code !== 200) return;
  const fresh = !S.turn || data.turn_id !== S.turn.turn_id || data.state !== S.turn.state;
  S.turn = data;
  if (data.state === "your_turn" && data.seconds_left != null) deadline = data.seconds_left;
  const seat = data.seat || {};
  $("whokind").textContent = "your seat";
  $("whoname").textContent = seat.name || "";
  $("whofrom").textContent = seat.hails_from ? "of " + seat.hails_from : "";
  $("footwho").textContent = seat.name ? "You are " + seat.name + "." : "";
  const inField = data.state === "in_field";
  if (inField !== S.inField || fresh){
    S.inField = inField;
    paintComposer();
    if (inField) readChannels();
  }
  if (fresh && data.state === "your_turn"){ S.sel.inbox = "gate"; S.shownDetail.inbox = null; }
}

let deadline = null;
function tick(){
  const el = $("clk"), W = S.W;
  if (!el || !W || !S.turn) return;
  const c = W.clock;
  if (deadline === null || deadline === undefined){ el.textContent = c.none; return; }
  const which = S.turn.kind === "share" ? c.share : c.gate;
  el.textContent = deadline > 0 ? which.replace("{left}", clockMS(deadline)) : c.closed;
  el.classList.toggle("low", deadline <= 60);
}
function clockMS(s){ const m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ":" + String(r).padStart(2, "0"); }
setInterval(() => { if (deadline > 0){ deadline -= 1; tick(); } }, 1000);

function gateDetail(){
  const d = S.turn, W = S.W, g = W && W.gates[d.kind];
  if (!g) return `<p class="muted">A question from the field is waiting for you.</p>`;
  const buttons = g.buttons.map(([label, prefix, cls, tip]) =>
    `<button class="b ${cls === "go" ? "go" : cls === "no" ? "no" : ""}" type="button" data-gate="${esc(prefix)}" data-tip="${esc(tip)}">${esc(label)}</button>`).join("");
  return `<div class="lead">${esc(g.lead)}</div>
    ${g.note ? `<p class="muted">${esc(g.note)}</p>` : ""}
    <div class="muted clock" id="clk"></div>
    <pre class="view">${renderView(d.view)}</pre>
    <label class="f" for="gatesay">${esc(g.hint)}</label>
    <textarea id="gatesay" placeholder="${esc(W.placeholder || "")}"></textarea>
    <div class="row">${buttons}</div>
    <div class="flash" id="gateflash" role="status"></div>
    <div class="silence">Silence is never taken as yes. Declining is a complete answer.</div>`;
}

// The same answers the classic seat page sends: the words of a button, then anything typed, as plain words.
let sending = false;
async function gateSend(prefix){
  const W = S.W, d = S.turn;
  if (sending || !d || d.state !== "your_turn") return;
  const box = $("gatesay"), typed = box.value.trim(), fl = W.flash;
  let text;
  if (["yes", "no", "received", "question"].includes(prefix)) text = (prefix + " " + typed).trim();
  else if (prefix === "share") text = "share";
  else if (prefix === "share-some"){
    const ids = typed.match(/\d+/g);
    if (!ids){ flash("gateflash", fl.share_which, false); return; }
    text = "share " + ids.map(n => "#" + n).join(" ");
  } else if (prefix === "pass") text = "pass";
  else { text = (prefix + typed).trim(); if (!text){ flash("gateflash", fl.nothing, false); return; } }
  sending = true;
  try {
    const {data} = await seatAction({text, turn_id: d.turn_id});
    if (data.ok){
      S.doneNote = W.recorded_as.replace("{action}", data.recorded_as.action);
      flash("gateflash", S.doneNote, true); box.value = "";
    }
    else flash("gateflash", data.error || fl.not_accepted, false);
  } finally { sending = false; }
}

async function askBack(){
  const {data} = await postJSON(BASE + "return", {});
  flash("backflash", data.ok ? S.W.asked_back : (data.error || S.W.flash.not_recorded), !!data.ok);
}

/* ------------------------------------------------------------------ the inbox */
const KINDS = {
  gate: "at the gates", request: "asks you", named: "names you", reply: "replied to you", circle_ask: "asks you in",
  knock: "knocks", harvest: "harvest", privacy: "privacy", repair_ask: "repair thread", circle_question: "a circle asks",
  declaration: "declaration", revision: "briefing", question: "a question", steward: "steward", host: "hosting",
  moving: "moving", invitee_question: "your invitee asks", not_done: "not done", for_you_alone: "for you alone",
  gate_question: "at the invitation", bridge: "help asked", offer: "an offer", field_pause: "pause", closed: "closed",
  runway: "funding", cost_alert: "spend", field: "the field",
};
const keyOf = x => x.kind === "for_you_alone" ? "alone:" + x.ts + ":" + (x.text || "").length
                 : x.kind + ":" + (x.entry == null ? x.what : x.entry);

function takeInbox(data){
  if (!data || data.tab !== "inbox") return;
  S.upto = data.upto || S.upto;
  // words for this person alone stay at the server until they are opened, on this page or another of the seat's;
  // once opened they count as read there, and this page keeps them while it is open
  for (const x of data.items){
    if (x.kind !== "for_you_alone") continue;
    if (!S.kept.some(k => keyOf(k) === keyOf(x))) S.kept.unshift(x);
    S.have = Math.max(S.have, x.ts || 0);
  }
  data.items = data.items.filter(x => x.kind !== "for_you_alone");
  S.inbox = data;
  if (!SEAT){
    const v = data.viewer || {};
    $("whokind").textContent = "the operator";
    $("whoname").textContent = v.name ? "reading as " + v.name : "";
    $("whofrom").textContent = v.name ? "your own seat, and what waits on you as operator" : "what waits on you as operator";
  }
  paintInbox();
}

function inboxItems(){
  const d = S.inbox || {items: []};
  const gate = d.items.filter(x => x.kind === "gate");
  const rest = d.items.filter(x => x.kind !== "gate");
  const kept = S.kept.map(x => ({...x, new: !S.seenKept.has(keyOf(x))}));
  return [...gate, ...kept, ...rest];
}

function paintInbox(){
  const items = inboxItems(), d = S.inbox || {};
  const fresh = items.filter(x => x.new).length;
  const badge = $("inboxcount");
  badge.textContent = fresh;
  badge.className = "badge" + (fresh ? "" : " zero");
  badge.setAttribute("aria-label", fresh ? fresh + " new" : "nothing new");
  let rows = items.map(x => {
    const k = keyOf(x), on = S.sel.inbox === (x.kind === "gate" ? "gate" : k);
    return `<button class="item" type="button" data-key="${esc(x.kind === "gate" ? "gate" : k)}" ${on ? 'aria-current="true"' : ""}>
      <span class="mark ${x.new ? "new" : ""}" aria-hidden="true"></span>
      <span class="what"><span class="tag ${x.kind === "gate" ? "gate" : ""}">${esc(KINDS[x.kind] || x.kind)}</span>${esc(x.what)}</span>
      <span class="when">${esc(ago(x.ts))}</span>
      <span class="meta">${x.new ? '<span class="sr">new. </span>' : ""}${x.by_name ? "from " + esc(x.by_name) : ""}${x.entry ? " &middot; #" + x.entry : ""}</span>
    </button>`;
  }).join("");
  if (SEAT && S.inField){
    rows = `<button class="item pinned" type="button" data-key="field" ${S.sel.inbox === "field" ? 'aria-current="true"' : ""}>
      <span class="mark" aria-hidden="true"></span><span class="what"><span class="tag">the field</span>What is new for you in the field</span>
      <span class="when"></span><span class="meta">everything you may read, since you last looked</span></button>` + rows;
  }
  if (!items.length) rows += `<div class="empty">${emptyInboxWords()}</div>`;
  if ($("inboxlist").dataset.sig !== rows){ $("inboxlist").innerHTML = rows; $("inboxlist").dataset.sig = rows; }
  // the first question at the gates is shown at once; otherwise the first item, on a wide screen
  if (!S.sel.inbox && items.length && innerWidth > 860) S.sel.inbox = items[0].kind === "gate" ? "gate" : keyOf(items[0]);
  paintInboxDetail();
}

function emptyInboxWords(){
  if (!SEAT) return "Nothing is waiting on you.";
  const W = S.W, t = S.turn || {}, m = t.member || {};
  if (!W) return "";
  if (S.inField) return "Nothing is waiting on you.";
  if (m.state === "OUT"){
    const [label, tip] = W["return"];
    return `${esc(m.joined ? W.left_member : W.left_declined)}
      <div class="row"><button class="b go" type="button" id="back" data-tip="${esc(tip)}">${esc(label)}</button></div>
      <div class="flash" id="backflash" role="status"></div>`;
  }
  return esc(W.waiting) + (m.returning ? `<p class="muted">${esc(W.asked_back)}</p>` : "")
    + `<p class="muted">${esc(W.watching)}</p>`;
}

function selectedItem(){
  const k = S.sel.inbox;
  if (!k) return null;
  if (k === "gate") return (S.inbox && S.inbox.items.find(x => x.kind === "gate")) || null;
  if (k === "field") return {kind: "field"};
  return inboxItems().find(x => keyOf(x) === k) || null;
}

function paintInboxDetail(force){
  const box = $("inboxdetail"), x = selectedItem();
  // keep what someone is typing: the pane is drawn again only when what it shows has changed
  const sig = x ? (x.kind === "gate" ? "gate:" + ((S.turn || {}).turn_id || "") : x.kind === "field" ? "field" : keyOf(x)) : "none";
  if (!force && S.shownDetail.inbox === sig) return;
  S.shownDetail.inbox = sig;
  if (!x){
    // what was just answered has left the inbox: say so where it was
    if (S.doneNote){ box.innerHTML = `<p class="flash ok">${esc(S.doneNote)}</p>`; S.doneNote = ""; return; }
    box.innerHTML = `<p class="muted">${S.inbox && inboxItems().length ? "Choose an item to read it in full and answer it, if you wish."
                                                                     : (SEAT ? "Nothing is waiting on you." : "Nothing is waiting on you.")}</p>`;
    return;
  }
  if (x.kind === "gate"){
    if (S.turn && S.turn.state === "your_turn" && S.W){ box.innerHTML = gateDetail(); tick(); }
    else if (S.doneNote) box.innerHTML = `<p class="flash ok">${esc(S.doneNote)}</p>`;     // just answered: say what was recorded
    else box.innerHTML = `<p class="muted">${esc(x.what)}</p>`;
    return;
  }
  if (x.kind === "field"){ box.innerHTML = `<p class="muted">Reading...</p>`; readFieldView(); return; }
  if (x.kind === "for_you_alone"){
    S.seenKept.add(keyOf(x)); paintInbox(); markRead();
    box.innerHTML = `<h2>${esc(x.what)}</h2>
      <pre class="view">${esc(x.text)}</pre>
      <p class="note">Shown to you alone, never written in the transcript. Words like these stay in your inbox until you
        open them on a page of your seat; now that you have, they count as read there, and this page keeps them only
        while it is open. Copy what you need to keep.</p>
      <div class="row"><button class="b" type="button" data-copy="1">Copy</button></div><div class="flash" id="ansflash" role="status"></div>`;
    box.querySelector("[data-copy]").onclick = () => copy(x.text);
    return;
  }
  box.innerHTML = `<div class="muted"><span class="tag">${esc(KINDS[x.kind] || x.kind)}</span>${x.by_name ? "from " + esc(x.by_name) : ""}
      ${x.entry ? " &middot; #" + x.entry : ""}${x.ts ? " &middot; " + esc(when(x.ts)) : ""}</div>
    <div class="said">${esc(x.what)}</div>
    ${answerControls(x)}
    ${x.note ? `<p class="note">${esc(x.note)}</p>` : ""}
    <div class="silence">${!x.answer ? "Nothing is asked of you here."
      : SEAT || x.answer.via === "post"
      ? "You may leave this unanswered. It waits here, and silence is never taken as yes."
      : x.kind === "cost_alert" ? "It stays here until you set a budget; leaving it changes nothing."
      : "It waits here until it is answered."}</div>`;
}

// The words for this person alone that they have opened count as read: the server is told when the newest of them
// was kept, up to the first one not opened yet, so one they have not opened is never counted read.
async function markRead(){
  if (!SEAT) return;
  let upto = 0;
  for (const x of [...S.kept].sort((a, b) => (a.ts || 0) - (b.ts || 0))){
    if (!S.seenKept.has(keyOf(x))) break;
    upto = x.ts || upto;
  }
  if (upto <= S.read) return;
  S.read = upto;
  try { await getJSON(TAB("inbox") + "?read=" + upto); } catch(e){ S.read = 0; }
}

// What each kind of item lets its reader answer, with the action that already answers it (its template).
function answerControls(x){
  const a = x.answer;
  if (!a) return "";
  if (a.via === "post" && !SEAT)
    return `<p class="muted">This waits on you as a participant: answer it from your own seat (its page, or your terminal).</p>`;
  const words = (label, ph) => `<label class="f" for="answords">${esc(label)}</label><textarea id="answords" placeholder="${esc(ph || "")}"></textarea>`;
  const btn = (how, label, cls, tip) => `<button class="b ${cls || ""}" type="button" data-answer="${esc(how)}"${tip ? ` data-tip="${esc(tip)}"` : ""}>${esc(label)}</button>`;
  const notNow = btn("later", "Not now", "quiet", "Nothing is sent, anywhere. It stays in your inbox.");
  let html = "";
  if (a.via === "post") switch (a.action){
    case "contribute":
      html = words("Your reply, in your own words" + (a.where ? ". It goes in " + a.where + ", where this was written" : ""), "")
        + `<div class="row">${btn("reply", "Reply", "go")}`
        + (x.kind === "request" ? btn("no", "Reply: no", "no", "Sends \"No.\" with anything you wrote, as a reply. It reaches the one who asked as any reply does: in their inbox, and as a wake if they are a model that has not turned off wakes for replies.")
                                + btn("notnow", "Reply: not now", "", "Sends \"Not now.\" with anything you wrote, as a reply.") : "")
        + notNow + `</div>`; break;
    case "answer":
      html = words("A note, or your reason for a no", "") + `<div class="row">${btn("yes", "Yes", "go")}${btn("no", "No", "no", "A no always has a reason, and it is shown to whoever it concerns.")}${notNow}</div>`; break;
    case "reply_circle": case "answer_question":
      html = words("Your answer", "") + `<div class="row">${btn("text", "Answer", "go")}${notNow}</div>`; break;
    case "respond":
      html = words("A reason (needed to object)", "") + `<div class="row">${btn("yes", "Yes", "go")}${btn("stand aside", "Stand aside")}${btn("object", "Object", "no")}${notNow}</div>`; break;
    case "steward":
      html = words("A note, if you like", "") + `<div class="row">${btn("yes", "Yes, I will keep a copy", "go")}${btn("no", "No", "no")}${notNow}</div>`; break;
    case "host":
      html = `<label class="f" for="ansfor">For how long you can fund it (everyone reads it in time, never in money)</label>
        <input id="ansfor" value="${esc((a.template || {})["for"] || "30d")}" size="8">` + words("A note, if you like", "")
        + `<div class="row">${btn("yes", "Yes, I will host it", "go")}${btn("no", "No", "no")}${notNow}</div>`; break;
    case "travel":
      html = `<div class="row">${btn("yes", "Yes, mine goes with it", "go")}${btn("no", "No, mine stays", "no")}${notNow}</div>`; break;
  }
  if (a.via === "op"){
    switch (a.action){
      case "answer":
        html = words("Your answer, in your own words", "")
          + `<div class="row">${btn("op-answer", "Answer", "go", "Recorded and attributed to you. They are asked the invitation again, with your answer, at the next Open.")}`
          + ((x.also || []).length ? btn("op-answer-many", `Answer all ${(x.also[0].template.presences || []).length} at once`, "", "Each of them sees it labelled as a shared answer.") : "")
          + `</div>`; break;
      case "bridge":
        html = words("A message to the field (needed for not yet)", "For example: The folder is attached as drafts.")
          + `<div class="row">${btn("done", "It is done", "go", "The field is told, with your message.")}${btn("not_yet", "Not yet", "", "Say what stops you for now. The request stays open.")}${notNow}</div>`; break;
      case "offer":
        html = words("A note for the field: what happens next, or why not", "")
          + `<div class="row">${btn("accept", "Accept", "go", "Nothing moves by itself: any money reaches the field outside this software, and you raise the budget when it arrives.")}${btn("decline", "Decline", "no")}${notNow}</div>`; break;
      case "resume":
        html = words("Why the pause ends now (participants will read this)", "") + `<div class="row">${btn("resume", "Resume the field", "go")}${notNow}</div>`; break;
      case "reopen":
        html = words("Why the field is reopened (participants will read this)", "") + `<div class="row">${btn("reopen", "Reopen the field", "go")}${notNow}</div>`; break;
      case "budget":
        html = `<label class="f" for="ansusd">A new budget, in US dollars (the total the field may spend, including what it has spent)</label>
          <input id="ansusd" type="number" min="0" step="0.01" value="${esc(a.template.usd || "")}">`
          + words("An optional message to the field", "") + `<div class="row">${btn("budget", "Set budget", "go", "If participants are in the field and a budget was set before, they are told funding changed, never in dollars, with your message if you write one. What the field was told is shown here once it is set.")}${notNow}</div>`; break;
    }
  }
  return html + `<div class="flash" id="ansflash" role="status"></div>`;
}

async function answer(x, how){
  const a = x.answer, typed = (($("answords") || {}).value || "").trim();
  const fl = m => flash("ansflash", m, false);
  if (how === "later"){
    S.sel.inbox = null; S.shownDetail.inbox = null; paintInbox();
    $("inboxdetail").insertAdjacentHTML("afterbegin", `<p class="flash ok">Nothing was sent. It stays in your inbox.</p>`);
    return;
  }
  const body = {...(a.template || {})};
  let res;
  if (a.via === "post"){
    switch (a.action){
      case "contribute":
        if (how === "reply" && !typed) return fl("Write your reply first.");
        body.content = how === "no" ? ("No. " + typed).trim() : how === "notnow" ? ("Not now. " + typed).trim() : typed; break;
      case "answer":
        if (how === "no" && !typed) return fl("A no always has a reason; it is shown to whoever it concerns.");
        body.yes = how === "yes"; body.reason = typed; break;
      case "reply_circle": case "answer_question":
        if (!typed) return fl("An answer needs words.");
        body.text = typed; break;
      case "respond":
        if (how === "object" && !typed) return fl("Say why you object; it is shown with your answer.");
        body.answer = how; body.reason = typed; break;
      case "steward":
        body.yes = how === "yes"; body.reason = typed; break;
      case "host":
        body.yes = how === "yes"; body.note = typed;
        if (how === "yes") body["for"] = ($("ansfor").value || "").trim(); else delete body["for"]; break;
      case "travel":
        body.yes = how === "yes"; break;
    }
    res = await seatPost(body);
  } else if (a.via === "op"){
    switch (how){
      case "op-answer":
        if (!typed) return fl("An answer needs words.");
        res = await opPost("answer", {...body, text: typed}); break;
      case "op-answer-many":
        if (!typed) return fl("An answer needs words.");
        res = await opPost("answer_many", {...x.also[0].template, text: typed}); break;
      case "done": case "not_yet":
        if (how === "not_yet" && !typed) return fl("Say what stops you for now: capacity, resources, anything else. The field reads it.");
        res = await opPost("bridge", {...body, outcome: how, note: typed}); break;
      case "accept": case "decline":
        res = await opPost("offer", {...body, outcome: how, note: typed}); break;
      case "resume": case "reopen":
        if (!typed) return fl("Say why; the field will read it.");
        res = await opPost(how, {note: typed}); break;
      case "budget":
        res = await opPost("budget", {usd: Number($("ansusd").value), note: typed}); break;
    }
  }
  if (!res) return;
  const d = res.data || {};
  if (d.ok){
    S.doneNote = a.via === "op" && a.action === "budget" ? (d.note || "Recorded.") : "Recorded. " + (d.note || "");
    flash("ansflash", S.doneNote, true);
    if ($("answords")) $("answords").value = "";
  } else flash("ansflash", d.error || "Not recorded.", false);
}

// What everyone sees of anyone: here, pausing (with the note they left) or away. The software's own notes (awake,
// answering, active) come only to whoever may see them, and are shown to them beside it, never instead of it.
function status(r){
  const word = r.presence || (r.state === "IN" ? "here" : "away");
  const kept = "awake" in r && r.state === "IN"
    ? [["awake", r.awake], ["answering", r.answering], ["active", r.active && !r.answering]].filter(([, v]) => v).map(([w]) => w) : [];
  return {cls: word, word, kept: kept.join(", ")};
}
function flatAgents(rows, depth, out){
  for (const r of rows){ out.push([r, depth]); flatAgents(r.brought || [], depth + 1, out); }
  return out;
}

/* the activity grid: weeks as columns, days as rows, a few shades, and a mark for work in the repository */
function paintActivity(){
  const d = S.activity, card = $("activitycard");
  if (!d || !d.participants){ card.hidden = true; return; }
  card.hidden = false;
  const sel = $("actwho"), keep = sel.value;
  const opts = `<option value="">everyone</option>` + d.participants.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  if (sel.dataset.sig !== opts){ sel.innerHTML = opts; sel.dataset.sig = opts; sel.value = d.participants.some(p => p.id === keep) ? keep : ""; }
  const who = sel.value ? d.participants.filter(p => p.id === sel.value) : d.participants;
  const days = {};
  for (const p of who) for (const [day, v] of Object.entries(p.days || {})){
    const t = days[day] || (days[day] = {acts: 0, github: 0});
    t.acts += v.acts || 0; t.github += v.github || 0;
  }
  const parse = s => { const [y, m, dd] = s.split("-").map(Number); return Date.UTC(y, m - 1, dd); };
  const DAY = 86400000, to = parse(d.to), from0 = parse(d.from);
  const from = from0 - new Date(from0).getUTCDay() * DAY;         // back to a Sunday, so each column is a week
  const weeks = Math.ceil((to - from + DAY) / (7 * DAY));
  const max = Math.max(1, ...Object.values(days).map(v => v.acts));
  const level = n => n <= 0 ? 0 : n <= max * 0.25 ? 1 : n <= max * 0.5 ? 2 : n <= max * 0.75 ? 3 : 4;
  const C = 11, G = 2, L = 26, T = 16;
  let cells = "", months = "", lastMonth = -1, total = 0, active = 0, gh = 0;
  for (let w = 0; w < weeks; w++){
    for (let r = 0; r < 7; r++){
      const t = from + (w * 7 + r) * DAY;
      if (t < from0 || t > to) continue;
      const key = new Date(t).toISOString().slice(0, 10), v = days[key] || {acts: 0, github: 0};
      const x = L + w * (C + G), y = T + r * (C + G);
      total += v.acts; if (v.acts) active++; gh += v.github;
      const tip = `${key}: ${v.acts} entr${v.acts === 1 ? "y or act" : "ies and acts"}${v.github ? ", " + v.github + " in the repository" : ""}`;
      cells += `<rect x="${x}" y="${y}" width="${C}" height="${C}" rx="2" style="fill:var(--heat${level(v.acts)})"><title>${tip}</title></rect>`;
      if (v.github) cells += `<circle cx="${x + C / 2}" cy="${y + C / 2}" r="2.2" style="fill:var(--gh)" pointer-events="none"/>`;
      const m = new Date(t).getUTCMonth();
      if (r === 0 && m !== lastMonth){ lastMonth = m; months += `<text x="${x}" y="10">${new Date(t).toLocaleString(undefined, {month: "short", timeZone: "UTC"})}</text>`; }
    }
  }
  const labels = [[1, "Mon"], [3, "Wed"], [5, "Fri"]].map(([r, n]) => `<text x="0" y="${T + r * (C + G) + 9}">${n}</text>`).join("");
  const W = L + weeks * (C + G), H = T + 7 * (C + G);
  $("heat").innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Entries and acts per day, ${esc(d.from)} to ${esc(d.to)}, UTC">${months}${labels}${cells}</svg>`;
  $("heatlegend").innerHTML = `less ${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--heat${i})"></i>`).join("")} more
    <span style="margin-left:1rem"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10" rx="2" style="fill:var(--heat1)"/><circle cx="5" cy="5" r="2.2" style="fill:var(--gh)"/></svg>
    a day with work in the field's repository (its github tools)</span>`;
  $("actsum").textContent = `${total.toLocaleString()} entries and acts on ${active} day${active === 1 ? "" : "s"}` + (gh ? `, ${gh} in the repository` : "") + " (UTC days)";
  $("actnote").textContent = d.note || "";
  $("acttable").innerHTML = `<table><thead><tr><th>Participant</th><th class="n">Entries and acts</th><th class="n">Days</th><th class="n">Repository</th>${d.participants.some(p => "wakes" in p) ? '<th class="n">Wakes</th>' : ""}</tr></thead><tbody>`
    + d.participants.map(p => `<tr><td>${esc(p.name)}</td><td class="n">${num(p.acts)}</td><td class="n">${Object.keys(p.days || {}).length}</td>

    + `</tbody></table>`;
}

// One small form for every action that needs a note first, so nothing is done in a single unconsidered click.
function confirmWith({title, explain, label, go, required, run}){
  const box = $("confirm");

function wireOperator(){

  const here = S.channels.find(x => x.key === S.channel) || {kind: "root", name: ""};
  const tip = (W.field.buttons.find(b => b[1] === prefix) || [])[3] || "";
  if (prefix === "copycov"){
    const v = (S.lastView || "").split("\n");
    const start = v.findIndex(l => l.startsWith("COVENANT PAGE (")), end = v.findIndex(l => l.startsWith("END OF COVENANT PAGE"));
    if (start < 0 || end < start) return flash("composeflash", W.flash.no_covenant + " (Open \"What is new for you\" in the Inbox first.)", false);
    const page = v.slice(start + 1, end).map(l => l.replace(/^\| ?/, "")).join("\n");
    box.value = page === "(empty)" ? "" : page;
    flash("composeflash", W.flash.covenant_copied, true);
  } else if (prefix === "follow"){
    box.value = here.kind === "circle" ? "follow circle " + here.name : "follow " + (here.name || "the field");
  } else {
    box.value = prefix + box.value.replace(/^\s+/, "");
  }
  $("composehint").textContent = tip;
  box.focus();
});
// "#12" anywhere in a view, clicked or with Enter: reply to it from the box below
document.addEventListener("click", e => { const c = e.target.closest("[data-cite]"); if (c) cite(c.dataset.cite); });
document.addEventListener("keydown", e => { const c = e.target.closest && e.target.closest("[data-cite]"); if (c && e.key === "Enter") cite(c.dataset.cite); });

$("composeform").addEventListener("submit", async e => {
  e.preventDefault();
  if (sending) return;
  const text = $("say").value.trim();
  if (!text) return flash("composeflash", SEAT && S.W ? S.W.flash.nothing : "Write the notice first.", false);
  sending = true;
  try {
    if (!SEAT){
      const {data} = await opPost("note", {text});
      flash("composeflash", data.ok ? "Notice recorded. Participants see it in their next view." : (data.error || "Not recorded."), !!data.ok);
      if (data.ok) $("say").value = "";
      return;
    }
    const to = $("to").value.split(",").map(s => s.trim()).filter(Boolean), ask = $("ask").checked;
    if (ask && !to.length) return flash("composeflash", "A request names whom it asks: write their names after \"to\".", false);
    // plain words go as they are written, so every way of acting the classic page knows works here too;
    // naming people, asking, or replying from a #id makes them an ordinary contribution that says so
    const body = (to.length || ask || S.replyTo)
      ? {action: "contribute", content: text, ...(to.length ? {to} : {}), ...(ask ? {ask: true} : {}),
         ...(S.replyTo ? {reply_to: S.replyTo} : {}), channel: S.channel}
      : {text, channel: S.channel};
    const {data} = await seatPost(body);
    const came = $("came");
    came.hidden = !(data.results && data.results.length);
    came.textContent = came.hidden ? "" : data.results.join("\n\n");
    $("cameprivate").hidden = !data.private;
    if (data.private){ $("cameprivatewords").textContent = S.W.bring.shown; $("cameprivatetext").textContent = data.private; }
    if (data.ok){
      // what the field recorded: whom it names and asks, and who was not found
      const rec = (data.recorded || []).find(r => r.kind === "contribute") || {};
      const missing = rec.to_unknown || [];
      let said = S.W.field.kept;
      if (ask && rec.ask) said += " It waits in their inbox as a request, and holds up no one.";
      else if (ask) said += ` No one by ${missing.length > 1 ? "those names" : "that name"} was found (${missing.join(", ")}): it was posted as ordinary words, not a request.`;
      if (missing.length && (rec.ask || !ask)) said += " Not found: " + missing.join(", ") + ".";
      flash("composeflash", said, !(ask && !rec.ask));
      $("say").value = ""; $("ask").checked = false; $("to").value = "";
      S.replyTo = null; $("replychip").hidden = true;
    } else flash("composeflash", data.error === "floor" ? "Not yet: the field's floor. Try again in a moment." : (data.error || S.W.flash.not_accepted), false);
  } finally { sending = false; }
});

/* ------------------------------------------------------------------ hover and focus help */
// The buttons here can decide consent, so what each one does is readable before it is pressed:
// on hover, and on keyboard focus.
const TIP = document.createElement("div"); TIP.id = "tip"; TIP.setAttribute("role", "tooltip"); document.body.appendChild(TIP);
function showTip(el){
  const t = el.getAttribute("data-tip"); if (!t) return;
  TIP.textContent = t; TIP.classList.add("on");
  TIP.style.left = "0px"; TIP.style.top = "0px";
  const r = el.getBoundingClientRect(), b = TIP.getBoundingClientRect();
  let x = r.left, y = r.top - b.height - 8;
  if (y < 10) y = r.bottom + 8;
  if (x + b.width > innerWidth - 10) x = innerWidth - b.width - 10;
  TIP.style.left = Math.max(10, x) + "px"; TIP.style.top = Math.max(10, y) + "px";
}
function hideTip(){ TIP.classList.remove("on"); }
document.addEventListener("mouseover", e => { const el = e.target.closest && e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusout", hideTip);
document.addEventListener("scroll", hideTip, true);

/* ------------------------------------------------------------------ begin */
(async function start(){
  $("classic").href = CLASSIC;
  $("classic").textContent = SEAT ? "The classic seat page" : "The classic console";
  $("recordlink").hidden = SEAT;
  paintLater();
  paintComposer();
  try { await readWords(); } catch(e) {}
  paintComposer();
  show(location.hash.slice(1) || "inbox");
  loop();
})();
