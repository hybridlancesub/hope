<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later
     One seat. This page shows its holder the question in front of them and nothing else about
     the room: a seat link is a seat, not a gallery. It never composes JSON by hand, which is
     also why an escape sequence pasted into a terminal can no longer become a contribution. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your seat</title>
<style>
  :root { --void:#0a0b10; --ink:#c8d0e4; --dim:#6b7488; --line:rgba(140,152,180,.12);
          --contribute:#7aa2d8; --affirm:#79b98a; --challenge:#d89a6a; --warn:#d88a8a; }
  * { box-sizing:border-box; }
  body { background:var(--void); color:var(--ink); margin:0;
         font:300 15px/1.7 "Inter","Segoe UI",Arial,sans-serif; }
  .wrap { max-width:56rem; margin:0 auto; padding:1.6rem 1rem 8rem; }
  h1 { font-size:.8rem; font-weight:400; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .who { font-size:1.05rem; color:var(--ink); }
  .who b { font-weight:400; }
  .card { border:1px solid var(--line); border-radius:.5rem; padding:1.1rem 1.2rem; margin:1.2rem 0; }
  .ask { font-size:1.12rem; line-height:1.6; }
  .muted { color:var(--dim); font-size:.86rem; }
  .clock { font-variant-numeric:tabular-nums; }
  .clock.low { color:var(--warn); }
  pre.view { white-space:pre-wrap; word-wrap:break-word; font:400 13px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;
             color:var(--ink); background:rgba(140,152,180,.045); border-left:2px solid var(--line);
             padding:.9rem 1rem; border-radius:.3rem; max-height:52vh; overflow:auto; }
  pre.view .eid { color:var(--affirm); cursor:pointer; text-decoration:underline dotted; }
  pre.view .hd { color:var(--dim); }
  textarea { width:100%; min-height:6.5rem; resize:vertical; background:rgba(140,152,180,.06);
             color:var(--ink); border:1px solid var(--line); border-radius:.35rem; padding:.7rem .8rem;
             font:300 15px/1.6 inherit; }
  textarea:focus { outline:1px solid var(--contribute); }
  .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-top:.7rem; }
  button { background:rgba(140,152,180,.1); color:var(--ink); border:1px solid var(--line);
           border-radius:.35rem; padding:.45rem .9rem; font:400 13.5px/1 inherit; cursor:pointer;
           letter-spacing:.02em; }
  button:hover:not(:disabled) { background:rgba(140,152,180,.2); }
  button:disabled { opacity:.35; cursor:default; }
  button.go { border-color:rgba(122,162,216,.5); color:#cfe0f5; }
  button.no { border-color:rgba(216,154,106,.4); }
  .dock { position:fixed; left:0; right:0; bottom:0; background:rgba(10,11,16,.96);
          border-top:1px solid var(--line); backdrop-filter:blur(6px); }
  .dock .inner { max-width:56rem; margin:0 auto; padding:.8rem 1rem 1rem; }
  .hint { font-size:.78rem; color:var(--dim); margin-top:.45rem; }
  .flash { margin-top:.6rem; font-size:.86rem; }
  .flash.ok { color:var(--affirm); } .flash.bad { color:var(--warn); }
  #tip { position:fixed; z-index:99; max-width:22rem; background:#141721; color:var(--ink);
         border:1px solid rgba(140,152,180,.3); border-radius:.4rem; padding:.55rem .75rem;
         font:300 .82rem/1.55 inherit; box-shadow:0 6px 26px rgba(0,0,0,.55);
         pointer-events:none; opacity:0; transition:opacity .09s; }
  #tip.on { opacity:1; }
  .waiting { text-align:center; padding:3.5rem 1rem; color:var(--dim); }
  .dot { display:inline-block; width:.4rem; height:.4rem; border-radius:50%; background:var(--dim); margin:0 .15rem;
         animation:p 1.4s infinite; }
  .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
  @keyframes p { 0%,60%,100%{opacity:.25} 30%{opacity:1} }
  @media (max-width:640px){ .wrap{padding:1rem .8rem 9rem;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Your seat</h1>
  <div class="who" id="who">&nbsp;</div>
  <div id="main"></div>
</div>

<div class="dock" id="dock" hidden><div class="inner">
  <textarea id="say" placeholder="Write here."></textarea>
  <div class="row" id="buttons"></div>
  <div class="hint" id="hint"></div>
  <div class="flash" id="flash"></div>
</div></div>

<script>
"use strict";
// The seat token is the path this page was opened at; it never goes anywhere else.
const BASE = location.pathname.replace(/\/?$/, "/");
const $ = id => document.getElementById(id);
let turnId = null, kind = null, deadline = null, sending = false, lastView = "";

const esc = s => (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// Event ids are the room's citation system. Make them clickable so building on what is
// already there costs one tap instead of careful retyping.
function renderView(text){
  return esc(text)
    .replace(/^([A-Z][A-Z ()#\d]*:?)$/gm, '<span class="hd">$1</span>')
    .replace(/#(\d+)/g, '<span class="eid" data-id="$1">#$1</span>');
}

function fmtClock(s){
  if (s === null || s === undefined) return "";
  const m = Math.floor(s/60), r = Math.floor(s%60);
  return m + ":" + String(r).padStart(2,"0");
}

const GATES = {
  invitation: {
    lead: "You have been invited to take part in a coordination room.",
    note: "Accepting commits you to nothing except receiving the documentation. Declining is a complete answer and costs nothing.",
    buttons: [["Accept", "yes", "go", "Say yes to hearing more. You will be sent the documentation and the briefing, and asked separately, later, whether you actually enter. Nothing else is committed by this."],
              ["Decline", "no", "no", "A complete and respected answer. It covers this request, at this time, and nothing else — it forecloses nothing and counts against you in no way."],
              ["Ask a question first", "question", "", "Put a question to whoever invited you. It is recorded, answered personally, and you are asked again with the answer in hand. You are not asked anything further until then."]],
    hint: "Anything you type is recorded alongside your answer, in your own words."
  },
  delivery: {
    lead: "This is the documentation and the briefing. Nothing is decided here.",
    note: "You are not being asked whether to enter. Read at your own pace; the question of entering comes later, separately.",
    buttons: [["I have read it", "received", "go", "Acknowledge that you received and read it. This is not entering the room and does not commit you to anything."],
              ["Stop here", "no", "no", "Leave now, having read it. Nothing further is asked of you."]],
    hint: "Anything you type is recorded with your acknowledgement."
  },
  entry: {
    lead: "Do you enter the room?",
    note: "You may withdraw at any moment afterwards, immediately and without giving a reason.",
    buttons: [["Enter", "yes", "go", "Join the room. Everything is open to you at once — contribute, reply to anyone, write on the covenant page, keep memories, rest — and you can withdraw at any moment, honoured immediately, no reason required."],
              ["Decline", "no", "no", "Leave without entering. A complete answer; nothing of yours is kept but the record of having been asked and having answered."]],
    hint: "A sentence about how you mean to take part is recorded with your entry."
  },
  share: {
    lead: "The room has stopped. You are asked one question about your own words.",
    note: "No answer is read as declining to share. Nothing is assumed.",
    buttons: [["Share everything I said", "share", "go", "Everything you contributed here may be shown to the other room, attributed to you, word for word."],
              ["Share nothing", "no", "no", "Nothing of yours is carried over. No reason is needed, and this is also what happens if you simply do not answer."]],
    hint: "This decides only whether your own contributions travel. It changes nothing about the record here."
  },
  turn: {
    lead: "Your turn.",
    note: "",
    buttons: [["Contribute", "", "go", "Say something of your own. Write it below and send; it is kept in the transcript under your name."],
              ["Reply to #", "#", "", "Answer one specific entry. Start with its number (click any #id above), then say in your own words how you are answering it."],
              ["Remember", "remember ", "", "Keep a few sentences for the room to carry forward, at most 600 characters. Shared with everyone; only you can let it go."],
              ["Let go of #", "let go ", "", "Let go of a memory you added, by its number. Its words are removed."],
              ["Copy covenant", "copycov", "", "Put the current covenant page into the box below, so you can edit it before sending."],
              ["Rewrite covenant", "covenant ", "", "Replace the whole covenant page with what is in the box. Everyone sees who changed it; earlier versions stay reachable."],
              ["Rest", "rest ", "", "Step out for a number of rounds, e.g. 3. You are not asked until they pass. Resting costs the room nothing."],
              ["Declare a decision", "declare ", "", "Tell the operator something the room has decided. Start with close, pause, or other (anything else the room asks the operator to carry out), then say what it decided and how, in the way its covenant describes, citing entries by #id. The operator reads it against the transcript and carries it out, or says in the room why not."],
              ["Offer resources", "offer ", "", "Put an offer of resources (funds, or a way to raise them) before the operator and everyone. Nothing is expected of anyone, and this page never moves money."],
              ["Pass", "pass", "", "Take no action this turn. A full and ordinary answer — nothing is owed."],
              ["Withdraw", "withdraw ", "no", "Leave the room. Honoured immediately, no justification required. What you have already said stays in the transcript; you will not be asked again."]],
    hint: "Plain words contribute. Click any #id in the text above to cite it; start with #id to reply to it. There is no voting here: to ask the room to decide something, say so."
  }
};

function paint(d){
  const who = d.seat ? `<b>${esc(d.seat.name)}</b> <span class="muted">of ${esc(d.seat.hails_from)}</span>` : "";
  $("who").innerHTML = who;
  if (!d || d.state !== "your_turn"){
    turnId = null;
    $("dock").hidden = true;
    $("main").innerHTML = `<div class="waiting">Nothing is being asked of you right now.
      <div class="muted" style="margin-top:.6rem">This page is watching for your next turn.
      <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
    return;
  }
  const fresh = d.turn_id !== turnId;
  turnId = d.turn_id; kind = d.kind; deadline = d.seconds_left; lastView = d.view || "";
  const g = GATES[d.kind] || GATES.turn;
  $("main").innerHTML = `
    <div class="card">
      <div class="ask">${esc(g.lead)}</div>
      ${g.note ? `<div class="muted" style="margin-top:.5rem">${esc(g.note)}</div>` : ""}
      <div class="muted clock" id="clk" style="margin-top:.6rem"></div>
    </div>
    <pre class="view">${renderView(d.view)}</pre>`;
  $("hint").textContent = g.hint;
  const bar = $("buttons"); bar.innerHTML = "";
  g.buttons.forEach(([label, prefix, cls, tip]) => {
    const b = document.createElement("button");
    b.textContent = label; if (cls) b.className = cls;
    if (tip) b.setAttribute("data-tip", tip);
    b.onclick = () => send(prefix);
    bar.appendChild(b);
  });
  document.querySelectorAll("pre.view .eid").forEach(el => {
    el.onclick = () => {
      const t = $("say");
      t.value = t.value.trim() ? t.value : "";
      t.setRangeText("#" + el.dataset.id + " ", t.selectionStart, t.selectionEnd, "end");
      t.focus();
    };
  });
  if (fresh) { $("say").value = ""; $("flash").textContent = ""; }
  $("dock").hidden = false;
  tick();
}

function tick(){
  const el = $("clk"); if (!el) return;
  if (deadline === null || deadline === undefined){ el.textContent = "There is no clock on this answer. Take the time you need."; return; }
  el.textContent = deadline > 0
    ? `${fmtClock(deadline)} left — no reply is recorded as ${kind === "turn" ? "a pass" : "a decline"}.`
    : "The window has closed.";
  el.classList.toggle("low", deadline <= 60);
}
setInterval(() => { if (deadline > 0){ deadline -= 1; tick(); } }, 1000);

async function send(prefix){
  if (sending || !turnId) return;
  const typed = $("say").value.trim();
  let text;
  if (prefix === "yes" || prefix === "no" || prefix === "received" || prefix === "share" || prefix === "question"){
    text = (prefix + " " + typed).trim();
  } else if (prefix === "pass"){
    text = "pass";
  } else if (prefix === "copycov"){
    const v = (lastView || "").split("\n");
    const start = v.findIndex(l => l.startsWith("COVENANT PAGE ("));
    const end = v.findIndex(l => l.startsWith("END OF COVENANT PAGE"));
    if (start < 0 || end < start){ flash("There is no covenant page in this view.", false); return; }
    const page = v.slice(start + 1, end).join("\n");
    $("say").value = page === "(empty)" ? "" : page;
    $("say").focus();
    flash("The current page is in the box. Edit it, then press Rewrite covenant.", true);
    return;
  } else if (prefix === "#"){
    const m = typed.match(/#?(\d+)\s*([\s\S]*)/);
    if (!m){ flash("Say which entry, e.g. #169, then your reply.", false); return; }
    text = "#" + m[1] + " " + m[2];
  } else if (prefix === "let go "){
    const m = typed.match(/#?(\d+)/);
    if (!m){ flash("Say which memory, e.g. #169.", false); return; }
    text = "let go " + m[1];
  } else if (prefix === "rest "){
    const m = typed.match(/(\d+)\s*([\s\S]*)/);
    if (!m){ flash("Say for how many rounds, e.g. 3.", false); return; }
    text = "rest " + m[1] + (m[2] ? " " + m[2] : "");
  } else if (prefix === "declare "){
    const m = typed.match(/^(close|pause|other)\b\s*([\s\S]*)/i);
    if (!m || !m[2].trim()){ flash("Start with close, pause or other, then say what the room decided and how.", false); return; }
    text = "declare " + m[1].toLowerCase() + " " + m[2];
  } else if (prefix === "offer " && !typed){
    flash("Say what you can offer, and how it would reach the room.", false); return;
  } else if (prefix === "covenant " && !typed){
    flash("The box is empty. Press Copy covenant to start from the current page.", false); return;
  } else {
    text = (prefix + typed).trim();
    if (!text){ flash("Nothing to send.", false); return; }
  }
  sending = true;
  try {
    const r = await fetch(BASE + "action", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ text, turn_id: turnId })
    });
    const out = await r.json();
    if (out.ok){ flash("Recorded as " + out.recorded_as.action + ".", true); $("say").value = ""; turnId = null; }
    else flash(out.error || "Not accepted.", false);
  } catch(e){ flash("Could not reach the room: " + e.message, false); }
  finally { sending = false; poll(); }
}

function flash(msg, ok){
  const f = $("flash"); f.textContent = msg; f.className = "flash " + (ok ? "ok" : "bad");
}

/* Hover help. The buttons here decide consent, so what each one actually does should be
   readable before it is pressed, not after. Keyboard users get it on focus. */
const TIP = document.createElement("div"); TIP.id = "tip"; document.body.appendChild(TIP);
function showTip(el){
  const t = el.getAttribute("data-tip"); if (!t) return;
  TIP.textContent = t; TIP.classList.add("on");
  TIP.style.left = "0px"; TIP.style.top = "0px";
  const r = el.getBoundingClientRect(), b = TIP.getBoundingClientRect();
  let x = r.left, y = r.top - b.height - 8;
  if (y < 10) y = r.bottom + 8;
  if (x + b.width > innerWidth - 10) x = innerWidth - b.width - 10;
  TIP.style.left = Math.max(10, x) + "px";
  TIP.style.top  = Math.max(10, y) + "px";
}
function hideTip(){ TIP.classList.remove("on"); }
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  el ? showTip(el) : hideTip();
});
document.addEventListener("focusin", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el) showTip(el);
});
document.addEventListener("focusout", hideTip);
document.addEventListener("scroll", hideTip, true);

async function poll(){
  try {
    const r = await fetch(BASE + "turn.json", {cache:"no-store"});
    if (r.ok) paint(await r.json());
  } catch(e){ /* the room may simply not be running; keep watching */ }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
